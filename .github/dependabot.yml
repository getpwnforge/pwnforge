version: 2
updates:
  # Backend Rust
  - package-ecosystem: "cargo"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "area/deps"
      - "area/backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-patch-minor:
        update-types:
          - "minor"
          - "patch"

  # Frontend Node/pnpm
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "area/deps"
      - "area/frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-patch-minor:
        update-types:
          - "minor"
          - "patch"

  # Dockerfiles
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "area/deps"
      - "area/backend"

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "area/deps"
      - "area/docker"

  # Images pinned in the Compose files at the root. The docker-compose
  # ecosystem matches both docker-compose.yml and docker-compose.dev.yml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "area/deps"
      - "area/docker"

  # The Rust toolchain pinned in backend/rust-toolchain.toml. A bump here also
  # needs the backend Dockerfile image (docker ecosystem above) and
  # rust-version in backend/Cargo.toml moved to the same release.
  - package-ecosystem: "rust-toolchain"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "area/deps"
      - "area/backend"

  # GitHub Actions workflows themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "area/deps"
      - "area/ci"
