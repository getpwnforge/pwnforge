services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETGID, SETUID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to the loopback interface: published as 0.0.0.0 these were
      # reachable from anything on the same network as the developer's machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - internal

  # Same profile as production, so `COMPOSE_PROFILES=garage` behaves the same
  # way locally. The only difference is the exposed port.
  #
  # Garage has no web console - MinIO's was the reason the old pin was stuck on
  # a 2025 release, and it is gone either way. Inspect a local instance with
  # the CLI or any S3 client; see "Inspecting object storage" in
  # CONTRIBUTING.md.
  #
  # Requires ops/garage/garage.toml (gitignored). Copy the .example and fill in
  # the two secrets before the first start.
  garage:
    image: dxflrs/garage:v2.4.1
    profiles: ["garage"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Loopback-bound, as everything else in the dev compose is: reachable from
    # the host for debugging, not from the network. 3900 is the S3 API, 3903
    # the admin API.
    ports:
      - "127.0.0.1:3900:3900"
      - "127.0.0.1:3903:3903"
    volumes:
      - ./ops/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  garage-init:
    image: python:3.13-alpine
    profiles: ["garage"]
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      PWNFORGE_GARAGE_CAPACITY: ${PWNFORGE_GARAGE_CAPACITY:-100G}
      PWNFORGE_GARAGE_ZONE: ${PWNFORGE_GARAGE_ZONE:-pwnforge}
      PWNFORGE_S3_ACCESS_KEY_ID: ${PWNFORGE_S3_ACCESS_KEY_ID}
      PWNFORGE_S3_SECRET_ACCESS_KEY: ${PWNFORGE_S3_SECRET_ACCESS_KEY}
      PWNFORGE_S3_BUCKET_ATTACHMENTS: ${PWNFORGE_S3_BUCKET_ATTACHMENTS}
      PWNFORGE_S3_BUCKET_AVATARS: ${PWNFORGE_S3_BUCKET_AVATARS}
    command: ["python3", "/init/bootstrap.py"]
    volumes:
      - ./ops/garage/bootstrap.py:/init/bootstrap.py:ro
      - ./ops/garage/garage.toml:/etc/garage.toml:ro
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: chef
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /app
    command: sh -c "cargo install cargo-watch --locked; cargo build -p admin-cli & cargo watch -x 'run -p api'"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: ${PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
      PUBLIC_URL: ${PUBLIC_URL}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # SETUP_TOKEN: ${SETUP_TOKEN}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CHECK_PWNED_PASSWORDS: ${CHECK_PWNED_PASSWORDS:-true}
      PWNFORGE_S3_ENDPOINT: ${PWNFORGE_S3_ENDPOINT-http://garage:3900}
      PWNFORGE_S3_REGION: ${PWNFORGE_S3_REGION:-garage}
      PWNFORGE_S3_ACCESS_KEY_ID: ${PWNFORGE_S3_ACCESS_KEY_ID}
      PWNFORGE_S3_SECRET_ACCESS_KEY: ${PWNFORGE_S3_SECRET_ACCESS_KEY}
      PWNFORGE_S3_FORCE_PATH_STYLE: ${PWNFORGE_S3_FORCE_PATH_STYLE:-true}
      PWNFORGE_S3_BUCKET_ATTACHMENTS: ${PWNFORGE_S3_BUCKET_ATTACHMENTS}
      PWNFORGE_S3_BUCKET_AVATARS: ${PWNFORGE_S3_BUCKET_AVATARS}
      PWNFORGE_S3_KEY_PREFIX: ${PWNFORGE_S3_KEY_PREFIX:-}
      PWNFORGE_S3_PUBLIC_BASE_URL: ${PWNFORGE_S3_PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BLOCK_DISPOSABLE_EMAILS: ${BLOCK_DISPOSABLE_EMAILS:-true}
      RUST_LOG: ${RUST_LOG:-info}
      BACKEND_ENV: development
    ports:
      - "${PORT}:3000"
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo
      - cargo-target:/app/target
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT}/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 240s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # No `garage` edge: depending on a profiled service re-enables its
      # profile (Compose >= 2.20), which would start Garage even for someone
      # pointing the dev stack at a real S3. The backend HeadBuckets at boot.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /app
    command: sh -c "pnpm install && pnpm dev"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_DEV_ALLOWED_HOST: ${VITE_DEV_ALLOWED_HOST}
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "1.0"
    networks:
      - internal
      - public

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  db-data:
  garage-meta:
  garage-data:
  cargo-cache:
  cargo-target:
  frontend-node-modules:
