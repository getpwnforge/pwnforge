[advisories]
ignore = [
  # RUSTSEC-2026-0235: rkyv 0.7.46, OOB read on archives containing Rc/Arc.
  # Declared as an optional dependency of rust_decimal, itself pulled in by
  # sea-orm's `with-rust_decimal` default feature. The rkyv feature is never
  # enabled: `cargo tree -i rust_decimal -e features` shows only "maths",
  # "serde" and "std" active, and `cargo tree -i rkyv --target all` returns
  # nothing. The crate is listed in Cargo.lock but never compiled into the
  # binary. PwnForge does not deserialize rkyv archives anywhere.
  # Remove once rust_decimal moves to rkyv 0.8.
  "RUSTSEC-2026-0235",

  # RUSTSEC-2026-0459: libsqlite3-sys, via SQLite's CVE-2026-119375. Optional
  # dependency of sqlx-sqlite, listed in Cargo.lock but never compiled:
  # PwnForge enables Postgres only, and `cargo tree -i libsqlite3-sys --target
  # all -e all` returns nothing.
  "RUSTSEC-2026-0459",

  # RUSTSEC-2026-0442: arrow-data, out-of-bounds read on RunEndEncoded arrays.
  # Reached only through sea-orm-arrow, an optional part of sea-orm that is
  # never enabled: `cargo tree -i arrow-data --target all -e all` returns
  # nothing. PwnForge reads no Arrow data.
  "RUSTSEC-2026-0442",

  # RUSTSEC-2026-0374: basic-toml, unmaintained, no known vulnerability. Used
  # by askama_derive at compile time only, to read askama's own configuration;
  # nothing of it runs in the binary. Remove once askama drops it.
  "RUSTSEC-2026-0374",

  # RUSTSEC-2026-0441: pin-utils, unmaintained, no known vulnerability. A
  # small macro crate pulled in by aws-smithy-http (aws-sdk-s3). Remove once
  # the AWS SDK drops it.
  "RUSTSEC-2026-0441",

  # Transitive build dependency, unmaintained but not vulnerable.
  "RUSTSEC-2026-0173",
]
