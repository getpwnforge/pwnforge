[package]
edition      = "2024"
name         = "migration"
publish      = false
rust-version.workspace = true
version      = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
dotenvy.workspace = true

[dependencies.sea-orm-migration]
features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
]
version = "2.0.4"
