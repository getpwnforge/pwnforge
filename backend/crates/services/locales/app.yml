# --- Security alerts ---
#
# These carry no action link on purpose: an alert that asks the reader to click
# is the exact shape a phishing message takes.

email.security_alert.not_you:
  en: "If this was not you, reset your password immediately and contact support."
  fr: "Si vous n'êtes pas à l'origine de cette action, réinitialisez votre mot de passe immédiatement et contactez le support."

email.security_alert.no_action:
  en: "If you made this change, there is nothing to do."
  fr: "Si vous êtes à l'origine de ce changement, il n'y a rien à faire."

email.security_alert.password_changed.title:
  en: "Your password was changed"
  fr: "Votre mot de passe a été modifié"

email.security_alert.password_changed.preheader:
  en: "Details of the change, and what to do if it was not you."
  fr: "Détails du changement, et quoi faire si ce n'était pas vous."

email.security_alert.password_reset.title:
  en: "Your password was reset"
  fr: "Votre mot de passe a été réinitialisé"

email.security_alert.password_reset.preheader:
  en: "Details of the reset, and what to do if it was not you."
  fr: "Détails de la réinitialisation, et quoi faire si ce n'était pas vous."

email.security_alert.password_changed.subject:
  en: "Your PwnForge password was changed"
  fr: "Votre mot de passe PwnForge a été modifié"

email.security_alert.password_changed.body:
  en: "The password on your account was changed. Your other sessions have been signed out."
  fr: "Le mot de passe de votre compte a été modifié. Vos autres sessions ont été déconnectées."

email.security_alert.password_reset.subject:
  en: "Your PwnForge password was reset"
  fr: "Votre mot de passe PwnForge a été réinitialisé"

email.security_alert.password_reset.body:
  en: "Your password was reset using a link sent to this address. All sessions have been signed out."
  fr: "Votre mot de passe a été réinitialisé via un lien envoyé à cette adresse. Toutes les sessions ont été déconnectées."

# --- Account moderation notices ---
#
# Same principle as security alerts: no action link. An admin action is not
# something the reader can undo by clicking through this email anyway — the
# reason (if any) lives in the audit log, communicated individually only if
# the user appeals.

email.account_notice.suspended.subject:
  en: "Your account has been suspended"
  fr: "Votre compte a été suspendu"

email.account_notice.suspended.title:
  en: "Account suspended"
  fr: "Compte suspendu"

email.account_notice.suspended.preheader:
  en: "Your PwnForge account has been suspended by an administrator."
  fr: "Votre compte PwnForge a été suspendu par un administrateur."

email.account_notice.suspended.body:
  en: "An administrator has suspended your account. You will not be able to sign in until it is reinstated. If you believe this is a mistake, contact support."
  fr: "Un administrateur a suspendu votre compte. Vous ne pourrez pas vous connecter tant qu'il n'est pas réactivé. Si vous pensez qu'il s'agit d'une erreur, contactez le support."

email.account_notice.unsuspended.subject:
