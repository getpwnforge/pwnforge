[workspace]
resolver = "3"
members = [
    "crates/admin-cli",
    "crates/api",
    "crates/domain",
    "crates/migration",
    "crates/seed",
    "crates/ws-pubsub",
    "crates/services",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
domain = { path = "crates/domain" }
dotenvy = "0.15.7"
anyhow = "1.0.104"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json", "with-ipnetwork", "mock"] }
tokio = { version = "1.53.1", features = ["full", "macros", "rt", "rt-multi-thread"] }
serde = "1.0.229"
serde_json = "1.0.151"
uuid = { version = "1.25.0", features = ["v4", "v7", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
chrono = "0.4.45"
validator = { version = "0.21.0", features = ["derive"] }
redis = { version = "1.5.0", features = ["tokio-comp", "connection-manager"] }
